<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？隨機美食抽籤機</title>
    <!-- 引入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Google Fonts 可愛字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- 引入 Canvas Confetti 慶祝紙花套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* 全局變數與樣式設定 - 黃橘色系 */
        :root {
            --primary-yellow: #FFB703;
            --primary-orange: #FB8500;
            --dark-orange: #E05300;
            --light-yellow: #FFF9E6;
            --bg-gradient: linear-gradient(135deg, #FFB703 0%, #FD9E02 50%, #FB8500 100%);
            --text-color: #333333;
            --white: #FFFFFF;
            --shadow: 0 10px 25px rgba(251, 133, 0, 0.25);
            --radius: 28px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
        }

        /* 背景可愛美食漂浮動畫 */
        .bg-decorations .food-icon {
            position: absolute;
            font-size: 2.8rem;
            opacity: 0.25;
            animation: float 6s infinite ease-in-out;
            user-select: none;
            pointer-events: none;
        }

        .pos-1 { top: 8%; left: 6%; animation-delay: 0s; }
        .pos-2 { top: 15%; right: 8%; animation-delay: 1s; }
        .pos-3 { bottom: 12%; left: 10%; animation-delay: 2s; }
        .pos-4 { bottom: 20%; right: 6%; animation-delay: 3s; }
        .pos-5 { top: 48%; left: 3%; animation-delay: 4s; }
        .pos-6 { top: 55%; right: 4%; animation-delay: 5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-22px) rotate(12deg); }
        }

        /* 主卡片容器 */
        .container {
            background: var(--white);
            width: 100%;
            max-width: 460px;
            padding: 32px 24px;
            border-radius: var(--radius);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
            text-align: center;
            position: relative;
            z-index: 10;
            border: 4px solid #FFE8B5;
        }

        /* 頂部標題 */
        .subtitle-badge {
            display: inline-block;
            background-color: var(--light-yellow);
            color: var(--dark-orange);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 12px;
            border: 1px solid #FFE099;
        }

        #main-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--dark-orange);
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* 生動彈跳動畫 (bounceIn) */
        .bounce-in {
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3) rotate(-5deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(3deg); }
            70% { transform: scale(0.95) rotate(-1deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* 滾動抽獎顯示框 */
        .slot-container {
            background: var(--light-yellow);
            border: 3px dashed var(--primary-yellow);
            border-radius: 20px;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary-orange);
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 結果展示卡片 */
        .result-card {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 2px solid #FFE5B4;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .result-card.hidden {
            display: none;
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #FFF3E0;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--primary-orange);
            color: var(--white);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .card-body {
            padding: 18px;
        }

        #result-name {
            font-size: 1.7rem;
            font-weight: 900;
            color: #2D1A00;
            margin-bottom: 14px;
        }

        /* 「馬上出發」按鈕 */
        .map-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #10B981; /* 活潑綠色導航按鈕 */
            color: var(--white);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
        }

        .map-btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        /* 點我抽籤大按鈕 */
        .action-zone {
            margin-bottom: 20px;
        }

        .btn-primary {
            background: linear-gradient(180deg, #FFB703 0%, #FB8500 100%);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(251, 133, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            outline: none;
            border-bottom: 4px solid var(--dark-orange);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(251, 133, 0, 0.5);
        }

        .btn-primary:active {
            transform: translateY(2px) scale(0.98);
            border-bottom-width: 2px;
        }

        /* 可摺疊管理選單區 */
        .list-manager {
            background: #FFFBF2;
            border-radius: 18px;
            padding: 14px;
            text-align: left;
            font-size: 0.9rem;
            border: 1.5px solid #FFE8B5;
        }

        .list-manager summary {
            font-weight: 700;
            color: var(--dark-orange);
            cursor: pointer;
            user-select: none;
            outline: none;
        }

        .manager-content {
            margin-top: 12px;
        }

        .add-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .add-form input {
            padding: 8px 12px;
            border: 1px solid #FFD8A8;
            border-radius: 10px;
            outline: none;
            font-size: 0.85rem;
        }

        .add-form input:focus {
            border-color: var(--primary-orange);
        }

        .btn-add {
            background: var(--primary-orange);
            color: var(--white);
            border: none;
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background: var(--dark-orange);
        }

        .restaurant-list {
            list-style: none;
            max-height: 140px;
            overflow-y: auto;
        }

        .restaurant-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid #FFE8B5;
            font-size: 0.85rem;
            font-weight: 700;
            color: #555;
        }

        .del-btn {
            background: none;
            border: none;
            color: #EF4444;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .del-btn:hover {
            background: #FEE2E2;
        }
    </style>
</head>
<body>

    <!-- 背景漂浮美食圖示 -->
    <div class="bg-decorations">
        <span class="food-icon pos-1">🍧</span>
        <span class="food-icon pos-2">🍳</span>
        <span class="food-icon pos-3">🍝</span>
        <span class="food-icon pos-4">🦆</span>
        <span class="food-icon pos-5">🍱</span>
        <span class="food-icon pos-6">🧋</span>
    </div>

    <!-- 主介面卡片 -->
    <div class="container">
        
        <!-- 頂部區 -->
        <header>
            <div class="subtitle-badge">✨ 今天吃什麼隨機抽籤機 ✨</div>
            <h1 id="main-title">今天吃什麼？</h1>
        </header>

        <!-- 滾動抽籤動畫顯示區 -->
        <div id="slot-machine" class="slot-container">
            <span id="slot-text">🎲 按下方按鈕開抽！</span>
        </div>

        <!-- 抽籤結果卡片 (預設隱藏) -->
        <div id="result-card" class="result-card hidden">
            <div class="img-wrapper">
                <img id="result-img" src="" alt="美食照片">
                <span class="tag">今日首選</span>
            </div>
            <div class="card-body">
                <h2 id="result-name">餐廳名稱</h2>
                <a id="map-btn" class="map-btn" href="#" target="_blank" rel="noopener noreferrer">
                    <i class="fa-solid fa-location-dot"></i> 馬上出發 🚀
                </a>
            </div>
        </div>

        <!-- 抽籤大按鈕 -->
        <div class="action-zone">
            <button id="draw-btn" class="btn-primary">
                <span>點我抽籤</span>
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
        </div>

        <!-- 可摺疊美食清單管理區 -->
        <details class="list-manager">
            <summary><i class="fa-solid fa-list-check"></i> 查看 / 編輯口袋餐廳清單</summary>
            <div class="manager-content">
                <div class="add-form">
                    <input type="text" id="new-name" placeholder="餐廳名稱 (例如: 永和豆漿)">
                    <input type="text" id="new-img" placeholder="圖片網址 (可選填)">
                    <button id="add-btn" class="btn-add">加入清單</button>
                </div>
                <ul id="restaurant-list" class="restaurant-list">
                    <!-- 由 JavaScript 動態繪製 -->
                </ul>
            </div>
        </details>
    </div>

    <script>
        // JS 邏輯完全包覆在 DOMContentLoaded 事件中，確保 DOM 載入完畢後才執行
        document.addEventListener('DOMContentLoaded', () => {

            // 1. 指定的 5 家預設餐廳與精選圖片
            const defaultRestaurants = [
                {
                    name: "癮冰室",
                    img: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "遊子廚房",
                    img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "傑克廚房",
                    img: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "華仁匯",
                    img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "鴨肉飯",
                    img: "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=600&q=80"
                }
            ];

            // 優先讀取 LocalStorage 或使用預設值
            let restaurants = JSON.parse(localStorage.getItem('my_restaurants')) || defaultRestaurants;

            // 2. DOM 元素綁定
            const mainTitle = document.getElementById('main-title');
            const drawBtn = document.getElementById('draw-btn');
            const slotContainer = document.getElementById('slot-machine');
            const slotText = document.getElementById('slot-text');
            const resultCard = document.getElementById('result-card');
            const resultImg = document.getElementById('result-img');
            const resultName = document.getElementById('result-name');
            const mapBtn = document.getElementById('map-btn');
            const restaurantListUI = document.getElementById('restaurant-list');
            const newNameInput = document.getElementById('new-name');
            const newImgInput = document.getElementById('new-img');
            const addBtn = document.getElementById('add-btn');

            let isDrawing = false; // 動畫防連點鎖定

            // 3. 渲染口袋清單
            function renderList() {
                restaurantListUI.innerHTML = '';
                restaurants.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>${index + 1}. ${item.name}</span>
                        <button class="del-btn" data-index="${index}" title="刪除">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;
                    restaurantListUI.appendChild(li);
                });

                // 綁定刪除按鈕事件
                document.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = e.currentTarget.getAttribute('data-index');
                        deleteRestaurant(idx);
                    });
                });
            }

            // 儲存至本地快取
            function saveData() {
                localStorage.setItem('my_restaurants', JSON.stringify(restaurants));
                renderList();
            }

            // 新增餐廳
            addBtn.addEventListener('click', () => {
                const name = newNameInput.value.trim();
                const img = newImgInput.value.trim() || "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=600&q=80";

                if (name === '') {
                    alert('請輸入餐廳名稱喔！');
                    return;
                }

                restaurants.push({ name, img });
                newNameInput.value = '';
                newImgInput.value = '';
                saveData();
            });

            // 刪除餐廳
            function deleteRestaurant(index) {
                if (restaurants.length <= 1) {
                    alert('請至少保留一家餐廳供抽籤喔！');
                    return;
                }
                restaurants.splice(index, 1);
                saveData();
            }

            // 4. 開始抽籤 (隨機滾動動畫)
            function startDraw() {
                if (isDrawing) return;
                if (restaurants.length === 0) {
                    alert('口袋清單目前沒有餐廳，請先新增！');
                    return;
                }

                isDrawing = true;

                // 隱藏結果卡片、重置標題狀態
                resultCard.classList.add('hidden');
                mainTitle.classList.remove('bounce-in');
                mainTitle.innerText = "今天吃什麼？";
                slotContainer.style.display = "flex";

                let counter = 0;
                const totalRolls = 22; // 滾動輪播次數
                const speed = 70; // 滾動頻率(ms)

                const timer = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * restaurants.length);
                    slotText.innerText = `🎰 ${restaurants[randomIndex].name}`;
                    counter++;

                    if (counter >= totalRolls) {
                        clearInterval(timer);
                        finishDraw(randomIndex);
                    }
                }, speed);
            }

            // 5. 抽籤完成處理 (彈跳動畫 + 紙花爆發 + Google Map 連結)
            function finishDraw(finalIndex) {
                const selected = restaurants[finalIndex];

                // 隱藏滾動顯示區
                slotContainer.style.display = "none";

                // 設定抽中結果
                resultImg.src = selected.img;
                resultName.innerText = selected.name;

                // 設定 Google Maps 導航搜尋連結
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selected.name)}`;
                mapBtn.href = mapUrl;

                // 用生動彈跳動畫替換標題
                mainTitle.innerText = `🎉 今天就吃：${selected.name}！`;
                void mainTitle.offsetWidth; // 觸發重繪
                mainTitle.classList.add('bounce-in');

                // 顯示結果卡片
                resultCard.classList.remove('hidden');

                // 播放慶祝紙花動畫 (Confetti)
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 90,
                        spread: 75,
                        origin: { y: 0.65 },
                        colors: ['#FFB703', '#FB8500', '#E05300', '#10B981', '#FFFFFF']
                    });
                }

                isDrawing = false;
            }

            // 6. 綁定按鈕點擊事件
            drawBtn.addEventListener('click', startDraw);

            // 初始化渲染口袋名單
            renderList();
        });
    </script>
</body>
</html>
