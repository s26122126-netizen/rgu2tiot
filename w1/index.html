<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 引入外部 CSS 樣式檔 -->
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Google Fonts 字型（讓字體更現代好看） -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 名片主體容器 -->
    <div class="card">
        <!-- 1. 圓形大頭貼 (請將 src 裡的網址替換成你的照片路徑) -->
        <img src="https://picsum.photos/150" alt="個人大頭貼" class="avatar">
        
        <!-- 2. 名字與簡介 -->
        <h1 class="name">小明 (Your Name)</h1>
        <p class="bio">✨ 熱愛生活的 UI/UX 設計新手 | 用色彩點亮世界 🎨</p>
        
        <!-- 3. 按鈕區域 -->
        <div class="button-group">
            <!-- 請將 href 裡的 # 替換成你的 Instagram 連結 -->
            <a href="https://instagram.com" target="_blank" class="btn btn-instagram">Instagram</a>
            <!-- 請將 href 裡的 email 替換成你的 Email -->
            <a href="mailto:your-email@example.com" class="btn btn-email">Email 我</a>
        </div>
    </div>

</body>
</html>
